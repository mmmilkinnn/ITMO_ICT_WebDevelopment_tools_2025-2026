site_name: Markozubova Anastasia | Web Programming Labs
site_description: Отчет по лабораторным работам
site_author: Anastasia Markozubova

theme:
  name: material
  language: ru
  palette:
    - scheme: default
      primary: teal
      accent: green
  font:
    text: Noto Sans
    code: JetBrains Mono

nav:
  - Главная: index.md
  - Лабораторная работа 1: lab1.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css
