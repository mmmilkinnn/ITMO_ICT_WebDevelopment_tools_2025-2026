site_name: Маркозубова Анастасия | Лабораторные работы
site_description: Отчет по лабораторным работам
site_author: Маркозубова Анастасия

theme:
  name: material
  language: ru
  palette:
    - scheme: default
      primary: deep orange
      accent: pink
  font:
    text: Rubik
    code: JetBrains Mono

nav:
  - Главная: index.md
  - Лабораторная работа 1: lab1.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css
